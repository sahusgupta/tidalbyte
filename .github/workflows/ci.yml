name: EarthLab
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r requirements.lock
      - run: pnpm install --frozen-lockfile
      - run: pnpm contracts:check
      - run: pnpm openapi:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
  simulator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: simulator/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
          cache-dependency-path: simulator/frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
